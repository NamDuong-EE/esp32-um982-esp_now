; ESP32U GNSS Rover - ESP-NOW Long Range

[platformio]
default_envs = esp32u_rover_espnow

[env]
build_unflags = -std=gnu++11 -std=c++11 -std=c++14
build_flags = -std=gnu++17

[env:esp32u_rover_espnow]
platform = espressif32@^6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
build_src_filter =
    +<*>
check_src_filters =
    +<**/*.cpp>
    +<**/*.h>
build_flags =
    ${env.build_flags}
    -DCONNECT_USING_WIFI=1
    -DCONNECT_USING_4G=0
    -DFIRMWARE_ROLE_ROVER=1
    -DBOARD_ESP32U

[env:native]
platform = native
test_framework = unity
test_build_src = true
test_filter = test_rtcm_protocol
build_src_filter =
    +<protocol/RtcmEspNowProtocol.cpp>
build_flags =
    ${env.build_flags}
    -Iinclude
